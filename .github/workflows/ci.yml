name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig-os: linux
          - os: macos-15
            zig-os: macos
          - os: windows-latest
            zig-package: zig-x86_64-windows-0.16.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - name: Install Zig 0.16.0
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PARAREC_ZIG_ARCH=$(uname -m)
          PARAREC_ZIG_ARCH=${PARAREC_ZIG_ARCH/arm64/aarch64}
          curl --fail --location "https://ziglang.org/download/0.16.0/zig-${PARAREC_ZIG_ARCH}-${{ matrix.zig-os }}-0.16.0.tar.xz" --output "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Install Zig 0.16.0 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://ziglang.org/download/0.16.0/${{ matrix.zig-package }}.zip -OutFile "$env:RUNNER_TEMP/zig.zip"
          Expand-Archive "$env:RUNNER_TEMP/zig.zip" -DestinationPath "$env:RUNNER_TEMP/zig"
          "$env:RUNNER_TEMP/zig/${{ matrix.zig-package }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:local
      - run: pnpm test:unit
      - run: pnpm test:api
      - run: pnpm build:client
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - run: pnpm test:release
      - run: pnpm test:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.os }}
          path: test-results/
