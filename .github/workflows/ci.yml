name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig-os: linux
          - os: macos-15
            zig-os: macos
          - os: windows-latest
            zig-package: zig-x86_64-windows-0.16.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: pnpm
      - name: Install Zig 0.16.0
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PARAREC_ZIG_ARCH=$(uname -m)
          PARAREC_ZIG_ARCH=${PARAREC_ZIG_ARCH/arm64/aarch64}
          curl --fail --location "https://ziglang.org/download/0.16.0/zig-${PARAREC_ZIG_ARCH}-${{ matrix.zig-os }}-0.16.0.tar.xz" --output "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Install Zig 0.16.0 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://ziglang.org/download/0.16.0/${{ matrix.zig-package }}.zip -OutFile "$env:RUNNER_TEMP/zig.zip"
          Expand-Archive "$env:RUNNER_TEMP/zig.zip" -DestinationPath "$env:RUNNER_TEMP/zig"
          "$env:RUNNER_TEMP/zig/${{ matrix.zig-package }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:local
      - run: pnpm test:unit
      - run: pnpm test:api
      - run: pnpm build:client
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - run: pnpm test:release
      - run: pnpm test:performance
      # Temporarily ship Linux binaries while beta testing is limited to Linux.
      - name: Package standalone binary
        if: runner.os == 'Linux'
        run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: release-${{ matrix.os }}
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.os }}
          path: test-results/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Create draft release with standalone binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "$RELEASE_TAG" --notes "Standalone Pararec binaries with embedded client assets."
